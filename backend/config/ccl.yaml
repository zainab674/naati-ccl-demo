# CCL test flow rules (mirrors the NAATI practice test). Scoring numbers live in scoring.yaml.

mock_test:
  dialogues_per_test: 2

segment:
  # As in the NAATI test: each press of Start is one attempt (hear the segment, speak after the chime, Finish
  # attempt). Pressing Start again repeats the segment; only the last attempt's recording is kept and scored.
  max_repeats_per_dialogue: 1 # NAATI allows one segment repeat per dialogue without penalty; each is a RepeatEvent
  response_window_seconds: 45 # recording stops automatically after this
  chime_seconds: 0.6          # chime appended to each segment's audio; recording starts when it ends

# Webcam preview, as in the NAATI test (Information 2 checks it; segment pages show it). Video is never recorded or
# uploaded. With required: false a student without a camera can still continue.
camera:
  preview: true
  required: false
  example_record_seconds: 10  # Information 2 example segment: longest test recording

recording:
  max_upload_mb: 15
  allowed_mime_types: ["audio/webm", "audio/ogg", "audio/mp4", "audio/mpeg", "audio/wav", "audio/x-wav"]

# Shown on the Information pages of the player (folded: line breaks become spaces).
information_1: >
  This test has two dialogues. Each dialogue is a conversation between an English speaker and a speaker of your
  test language, divided into segments. After each segment you will hear a chime. Interpret the segment into the
  other language after the chime. Your interpretation is recorded.
information_1_practice: >
  This practice dialogue is a conversation between an English speaker and a speaker of your test language, divided
  into segments. After each segment you will hear a chime. Interpret the segment into the other language after the
  chime. Your interpretation is recorded and scored like a dialogue in the test.
information_2: >
  This example segment lets you check your audio and visual equipment before the test. Click Start to hear a
  short sound, then speak after the chime: you should see yourself on camera and see the sound wave move while you
  speak. Click Finish attempt, then Play to hear your recording.

results:
  # After submission (never during an attempt): show the source segment text next to the feedback.
  show_source_transcript: true
