id: "financial-student-savings-account"
title: "Opening a Student Savings Account"
scenario: "A bank customer service officer helps a newly arrived international student open a savings account and explains the debit card."
domain: "Financial"
difficulty: "Easy"
language_pair: "hi-en"
speakers:
  en: { role: "Bank officer", gender: "female" }
  hi: { role: "Customer", gender: "male" }
segments:
  - speaker: "en"
    text: "Good afternoon and welcome. My name is Karen, I'm one of the customer service officers here. How can I help you today?"
    reference: "नमस्ते, आपका स्वागत है। मेरा नाम कैरन है, मैं यहाँ कस्टमर सर्विस ऑफ़िसर हूँ। आज मैं आपकी क्या मदद कर सकती हूँ?"
    student: "नमस्ते, आपका स्वागत है। मेरा नाम कैरन है, मैं यहाँ की एक कस्टमर सर्विस ऑफ़िसर हूँ। बताइए, आज मैं आपकी क्या मदद कर सकती हूँ?"
  - speaker: "hi"
    text: "जी, मैं पिछले महीने ही student visa पर ऑस्ट्रेलिया आया हूँ। मुझे एक savings account खोलना है, और online banking भी चाहिए।"
    reference: "Hi, I only came to Australia last month on a student visa. I'd like to open a savings account, and I'd also like online banking."
    student: "Hi, I came to Australia last month on a student visa. I want to open a savings account."
  - speaker: "en"
    text: "Of course. I'll need your passport and proof of your Australian address, such as a lease agreement or a utility bill. Do you have those with you today?"
    reference: "ज़रूर। मुझे आपका पासपोर्ट और ऑस्ट्रेलिया में आपके पते का सबूत चाहिए होगा, जैसे किराए का एग्रीमेंट या बिजली-पानी का बिल। क्या ये आज आपके पास हैं?"
    student: "ज़रूर। मुझे आपका पासपोर्ट और ऑस्ट्रेलिया के पते का प्रूफ़ चाहिए, जैसे लीज़ एग्रीमेंट या कोई यूटिलिटी बिल। क्या ये आज आपके पास हैं?"
  - speaker: "hi"
    text: "पासपोर्ट तो है, पर अभी मैं अपने cousin के घर रह रहा हूँ, तो lease मेरे नाम पर नहीं है। University का letter चलेगा क्या?"
    reference: "I have my passport, but I'm staying at my cousin's place at the moment, so the lease isn't in my name. Would a letter from the university be okay?"
    student: "I have my passport, but, um, right now I'm staying at my cousin's house, so the lease is not in my name. Will a, uh, university letter work?"
  - speaker: "en"
    text: "Yes, a letter from your university showing your current address is fine. This account has no monthly fees for full-time students, and it pays 4.5 percent bonus interest if you deposit monthly."
    reference: "हाँ, यूनिवर्सिटी का लेटर चल जाएगा, अगर उसमें आपका मौजूदा पता लिखा हो। फ़ुल-टाइम स्टूडेंट्स के लिए इस अकाउंट पर कोई मंथली फ़ीस नहीं है, और अगर आप हर महीने पैसे जमा करते हैं, तो इस पर 4.5 प्रतिशत बोनस ब्याज मिलता है।"
    student: "हाँ, यूनिवर्सिटी का लेटर चल जाएगा अगर उसमें आपका अभी का पता है। फ़ुल-टाइम स्टूडेंट्स के लिए इस अकाउंट पर कोई मंथली फ़ीस नहीं है, और हर महीने पैसे जमा करने पर 5.4 प्रतिशत बोनस ब्याज मिलता है।"
  - speaker: "hi"
    text: "अच्छा, ये तो बढ़िया है। और debit card कितने दिन में आएगा? मुझे अपनी part-time job की salary भी इसी account में मँगवानी है।"
    reference: "Oh, that's great. And how many days will the debit card take to arrive? I also want my part-time job salary paid into this account."
    student: "Oh, that's great. And how many days will the debit card take? I also want to get my part-time job salary into this account."
  - speaker: "en"
    text: "The card is posted within five to seven business days. In the meantime, you can use the app to make payments, and I'll give you your BSB and account number for your employer."
    reference: "कार्ड पाँच से सात वर्किंग डेज़ के अंदर डाक से भेज दिया जाता है। तब तक आप ऐप से पेमेंट कर सकते हैं, और मैं आपको आपका BSB और अकाउंट नंबर दे दूँगी, ताकि आप अपने एम्प्लॉयर को दे सकें।"
    student: "कार्ड पाँच से सात दिन में, माफ़ कीजिए, पाँच से सात वर्किंग डेज़ में डाक से आ जाएगा। तब तक आप ऐप से पेमेंट कर सकते हैं, और मैं आपको BSB और अकाउंट नंबर दे दूँगी अपने एम्प्लॉयर के लिए।"
  - speaker: "hi"
    text: "ठीक है। एक बात और, अगर card खो जाए या किसी को मेरा PIN पता चल जाए, तो मुझे क्या करना चाहिए? घर पर सब यही पूछ रहे थे।"
    reference: "Okay. One more thing: if I lose the card or someone finds out my PIN, what should I do? Everyone at home was asking me that."
    student: "Okay. One more thing, if the card gets lost or someone finds out my PIN, what should I do? Everyone at home was asking about this."
  - speaker: "en"
    text: "Call us straight away on the number on the back of your card, or lock the card instantly in the app. Never share your PIN with anyone, even bank staff."
    reference: "तुरंत कार्ड के पीछे लिखे नंबर पर हमें फ़ोन कीजिए, या ऐप में जाकर कार्ड को उसी वक़्त लॉक कर दीजिए। अपना PIN कभी किसी को मत बताइए, बैंक के कर्मचारियों को भी नहीं।"
    student: "कार्ड के पीछे लिखे नंबर पर हमें तुरंत फ़ोन कीजिए, या ऐप में कार्ड को फ़ौरन लॉक कर दीजिए। अपना PIN कभी किसी को मत बताइए, बैंक स्टाफ़ को भी नहीं।"
  - speaker: "hi"
    text: "समझ गया। बहुत शुक्रिया, आपने सब कुछ इतने आराम से समझाया। चलिए, फ़ॉर्म भर देते हैं।"
    reference: "Understood. Thank you so much, you explained everything so patiently. Let's go ahead and fill in the form."
    student: "Got it. Thank you very much, you explained everything so nicely. Let's fill in the form now, and I'll bring the university letter tomorrow."
