id: "health-diabetes-medication-review"
title: "Diabetes Medication Review"
scenario: "A GP reviews an elderly patient's insulin dose with his son after a low blood sugar episode sent him to hospital."
domain: "Health"
difficulty: "Moderate"
language_pair: "hi-en"
speakers:
  en: { role: "Doctor", gender: "female" }
  hi: { role: "Patient's son", gender: "male" }
segments:
  - speaker: "en"
    text: "Good morning, Mr Sharma. I've received the discharge summary from the hospital. Can you tell me in your own words what happened to your father last Tuesday?"
    reference: "नमस्ते शर्मा जी। मुझे अस्पताल से डिस्चार्ज समरी मिल गई है। क्या आप अपने शब्दों में बताएँगे कि पिछले मंगलवार को आपके पिताजी के साथ क्या हुआ था?"
    student: "नमस्ते शर्मा जी। मुझे हॉस्पिटल से डिस्चार्ज समरी मिल गई है। आप अपने शब्दों में बताइए कि पिछले मंगलवार को आपके पिताजी को क्या हुआ था?"
  - speaker: "hi"
    text: "मंगलवार सुबह नाश्ते से पहले उन्हें बहुत पसीना आ रहा था और हाथ काँप रहे थे। मम्मी ने शुगर चेक की तो 2.8 आई, फिर हम उन्हें सीधे emergency ले गए।"
    reference: "On Tuesday morning, before breakfast, he was sweating a lot and his hands were shaking. Mum checked his sugar and it was 2.8, so we took him straight to emergency."
    student: "On Tuesday morning before breakfast he was sweating a lot and his hands were shaking. Mum checked his sugar, it was 8.2, and we took him straight to emergency."
  - speaker: "en"
    text: "That sounds like a hypoglycaemic episode, meaning his blood sugar dropped too low. Was he taking his insulin at the usual time, and had he eaten properly the night before?"
    reference: "यह हाइपोग्लाइसीमिया का दौरा लगता है, यानी उनकी ब्लड शुगर बहुत ज़्यादा गिर गई थी। क्या वे इंसुलिन अपने सामान्य समय पर ही ले रहे थे, और क्या उन्होंने पिछली रात ठीक से खाना खाया था?"
    student: "यह हाइपोग्लाइसीमिया का दौरा लगता है, यानी उनकी ब्लड शुगर बहुत कम हो गई थी। क्या वे इंसुलिन अपने सामान्य समय पर ले रहे थे?"
  - speaker: "hi"
    text: "इंसुलिन तो वो हमेशा रात को दस बजे ही लेते हैं, पर उस रात उन्होंने खाना नहीं खाया था। बोले भूख नहीं है, बस एक कप चाय पी और सो गए।"
    reference: "He always takes his insulin at ten at night, but that night he didn't eat dinner. He said he wasn't hungry, just had a cup of tea and went to bed."
    student: "He always takes his insulin at 10 pm, but that night he didn't have dinner. He said he wasn't hungry, so he just had one cup of tea and went to sleep."
  - speaker: "en"
    text: "Thank you, that's helpful. I'm going to reduce his night-time insulin from twenty units to sixteen units, and he should continue his metformin, 500 milligrams twice a day with meals."
    reference: "धन्यवाद, इससे काफ़ी मदद मिली। मैं उनकी रात वाली इंसुलिन बीस यूनिट से घटाकर सोलह यूनिट कर रही हूँ, और वे अपनी मेटफ़ॉर्मिन, 500 मिलीग्राम, दिन में दो बार खाने के साथ लेते रहें।"
    student: "धन्यवाद, इससे मदद मिली। मैं उनकी रात की इंसुलिन बीस यूनिट से घटाकर... उह... सोलह यूनिट कर रही हूँ, और वे मेटफ़ॉर्मिन 500 मिलीग्राम दिन में दो बार खाने के साथ लेते रहें।"
  - speaker: "hi"
    text: "ठीक है डॉक्टर। पर हॉस्पिटल वालों ने एक नई गोली भी दी थी, उसका नाम याद नहीं आ रहा। क्या वो भी चालू रखनी है या बंद कर दें?"
    reference: "Okay, doctor. But the hospital also gave him a new tablet, I can't remember its name. Should he keep taking that one too, or should we stop it?"
    student: "Okay doctor. But the hospital also gave him a new tablet, I can't remember the name. Should he continue that as well, or should we stop it?"
  - speaker: "en"
    text: "Please don't stop any medication without checking with me first. Could you bring in all his tablets, including any vitamins or herbal supplements, at our next appointment on Friday the 14th?"
    reference: "कृपया मुझसे पूछे बिना कोई भी दवा बंद मत कीजिए। अगली अपॉइंटमेंट पर, जो शुक्रवार 14 तारीख़ को है, क्या आप उनकी सारी गोलियाँ ले आएँगे, कोई विटामिन या जड़ी-बूटी वाले सप्लीमेंट्स हों तो वो भी?"
    student: "कृपया मुझसे पूछे बिना कोई भी दवा बंद न करें। क्या आप अगली अपॉइंटमेंट पर, शुक्रवार 14 तारीख़ को, उनकी सारी गोलियाँ ला सकते हैं, विटामिन और हर्बल सप्लीमेंट्स समेत?"
  - speaker: "hi"
    text: "हाँ, वो रोज़ सुबह करेले का जूस पीते हैं और मेथी दाना भी खाते हैं। गाँव से मेरी बुआ ने भेजा था। उससे कोई problem तो नहीं है?"
    reference: "Yes, he drinks bitter gourd juice every morning and also eats fenugreek seeds. My aunt sent them from the village. That won't cause any problem, will it?"
    student: "Yes, he drinks bitter gourd juice every morning and also eats fenugreek seeds, which are very good for diabetes. My aunt sent them from the village. Is that a problem?"
  - speaker: "en"
    text: "Both of those can lower blood sugar, so combined with insulin they may have contributed. I'd suggest he stops the juice for now, and we'll review his readings in two weeks."
    reference: "ये दोनों चीज़ें ब्लड शुगर कम कर सकती हैं, इसलिए इंसुलिन के साथ मिलकर इनका भी इसमें हाथ हो सकता है। मेरी सलाह है कि फ़िलहाल वे जूस बंद कर दें, और दो हफ़्ते बाद हम उनकी रीडिंग्स देखेंगे।"
    student: "ये दोनों चीज़ें ब्लड शुगर कम कर सकती हैं, तो इंसुलिन के साथ इनका भी असर हो सकता है। मेरी सलाह है कि अभी के लिए वे जूस बंद कर दें और दो हफ़्ते बाद हम उनकी रीडिंग्स रिव्यू करेंगे।"
  - speaker: "hi"
    text: "ठीक है, मैं उन्हें समझा दूँगा। वैसे तो वो मेरी बात कम ही सुनते हैं, पर आप कह रही हैं तो मान जाएँगे। शुक्रिया डॉक्टर।"
    reference: "Alright, I'll explain it to him. He doesn't usually listen to me much, but since you're the one saying it, he'll agree. Thank you, doctor."
    student: "Yeah okay, I'll tell him. He never really listens to me anyway, but if you say so he'll go along with it. Cheers, doc."
