id: "legal-tenancy-bond-dispute"
title: "Rental Bond Dispute"
scenario: "A solicitor at a community legal centre advises a former tenant whose real estate agent wants to keep most of her rental bond."
domain: "Legal"
difficulty: "Hard"
language_pair: "hi-en"
speakers:
  en: { role: "Solicitor", gender: "male" }
  hi: { role: "Former tenant", gender: "female" }
segments:
  - speaker: "en"
    text: "Hello, Mrs Verma, I'm one of the solicitors here. Before we start, everything you tell me is confidential. I understand your former landlord is claiming part of your rental bond?"
    reference: "नमस्ते वर्मा जी, मैं यहाँ के वकीलों में से एक हूँ। शुरू करने से पहले बता दूँ कि आप मुझे जो भी बताएँगी, वह गोपनीय रहेगा। मुझे पता चला है कि आपके पुराने मकान-मालिक आपके किराए के बॉन्ड का कुछ हिस्सा माँग रहे हैं?"
    student: "हाय वर्मा जी, मैं यहाँ वकील हूँ। पहले ही बता दूँ, आप जो भी बोलोगी वो सब confidential रहेगा। सुना है आपका पुराना landlord आपके बॉन्ड के पैसे माँग रहा है?"
  - speaker: "hi"
    text: "जी हाँ। हमने चार हफ़्ते का बॉन्ड दिया था, 2,400 डॉलर। अब agent कह रहा है कि 1,850 डॉलर काटेंगे, carpet cleaning, दीवार के छेद और oven की सफ़ाई के लिए।"
    reference: "Yes. We paid four weeks' bond, 2,400 dollars. Now the agent says they'll deduct 1,850 dollars, for carpet cleaning, the holes in the wall and cleaning the oven."
    student: "Yes. We paid four weeks' bond, $2,400. Now the agent is saying they'll deduct $1,850 for carpet cleaning and the holes in the wall."
  - speaker: "en"
    text: "Did you complete an ingoing condition report when you moved in, and do you have a copy? That document is crucial, because it records the property's condition at the start of the tenancy."
    reference: "जब आप उस घर में आई थीं, तब क्या आपने शुरुआती कंडीशन रिपोर्ट भरी थी, और क्या उसकी कॉपी आपके पास है? वह दस्तावेज़ बहुत अहम है, क्योंकि उसमें दर्ज होता है कि किरायेदारी की शुरुआत में घर की हालत कैसी थी।"
    student: "जब आप घर में आई थीं, तब क्या आपने कोई रिपोर्ट भरी थी, और क्या उसकी कॉपी आपके पास है? वह दस्तावेज़ बहुत ज़रूरी है क्योंकि उसमें घर की हालत लिखी होती है।"
  - speaker: "hi"
    text: "हाँ, कॉपी है, और हमने photos भी लिए थे। दीवार पर वो छेद पहले से थे, report में साफ़ लिखा है। हमने तो एक भी कील नहीं ठोकी।"
    reference: "Yes, I have a copy, and we took photos as well. Those holes in the wall were already there, it's clearly written in the report. We didn't hammer in a single nail."
    student: "Yes, I have a copy and we took photos too. The holes in the wall were already there, it's clearly in the report, and the agent signed it as well. We didn't put in a single nail."
  - speaker: "en"
    text: "That's good evidence. Under tenancy law, a landlord cannot deduct for fair wear and tear, only for actual damage. Normal carpet wear after three years usually counts as fair wear and tear."
    reference: "यह अच्छा सबूत है। किरायेदारी कानून के तहत मकान-मालिक सामान्य टूट-फूट, यानी फ़ेयर वियर एंड टियर, के लिए पैसे नहीं काट सकता, सिर्फ़ असली नुकसान के लिए काट सकता है। तीन साल बाद कालीन का सामान्य रूप से घिसना आम तौर पर सामान्य टूट-फूट ही माना जाता है।"
    student: "यह अच्छा सबूत है। किरायेदारी कानून के तहत मकान-मालिक सामान्य टूट-फूट के लिए भी पैसे काट सकता है, सिर्फ़ असली नुकसान के लिए नहीं। तीन साल बाद कालीन का घिसना आम तौर पर सामान्य टूट-फूट माना जाता है।"
  - speaker: "hi"
    text: "पर agent बोल रहा है कि lease में लिखा था कि जाते समय professional carpet cleaning करवानी पड़ेगी, और उसकी receipt भी दिखानी होगी।"
    reference: "But the agent is saying the lease stated that we had to get professional carpet cleaning done when we moved out, and show the receipt for it as well."
    student: "But the agent says the lease said we had to get the carpets professionally cleaned when moving out, and also show the receipt."
  - speaker: "en"
    text: "Some leases include that clause, but in many cases it isn't enforceable unless the carpets were professionally cleaned before you moved in. Do you know whether they were?"
    reference: "कुछ लीज़ में यह शर्त होती है, लेकिन कई मामलों में यह लागू नहीं होती, जब तक कि आपके आने से पहले कालीन प्रोफ़ेशनल तरीक़े से साफ़ न करवाए गए हों। क्या आपको पता है कि करवाए गए थे या नहीं?"
    student: "कुछ लीज़ में यह शर्त होती है, पर कई मामलों में यह लागू होती है, माफ़ कीजिए, लागू नहीं होती, जब तक आपके आने से पहले कालीन प्रोफ़ेशनल तरीक़े से साफ़ न हुए हों। क्या आपको पता है?"
  - speaker: "hi"
    text: "मुझे पक्का नहीं पता, लेकिन जब हम आए थे तब carpet पर दाग़ थे। उनकी भी हमने photo ली थी, 3 March 2022 की date के साथ।"
    reference: "I'm not completely sure, but when we moved in there were stains on the carpet. We took a photo of those too, dated the 3rd of March 2022."
    student: "I'm not sure, but when we moved in there were stains on the carpet. We took a photo of that as well, dated the 3rd of May 2022."
  - speaker: "en"
    text: "Excellent. My advice is to write to the agent disputing the claim and attach the condition report and photos. If they don't respond within fourteen days, you can apply to the tribunal."
    reference: "बहुत बढ़िया। मेरी सलाह है कि आप एजेंट को लिखकर इस दावे पर आपत्ति जताइए और साथ में कंडीशन रिपोर्ट और फ़ोटो लगाइए। अगर वे चौदह दिनों के अंदर जवाब नहीं देते, तो आप ट्रिब्यूनल में आवेदन कर सकती हैं।"
    student: "बहुत बढ़िया। मेरी सलाह है कि आप एजेंट को लिखकर दावे पर आपत्ति जताइए और कंडीशन रिपोर्ट और फ़ोटो साथ भेजिए। अगर वे चार दिन में जवाब नहीं देते, तो आप ट्रिब्यूनल में आवेदन कर सकती हैं।"
  - speaker: "hi"
    text: "Tribunal का नाम सुनकर ही डर लगता है। क्या उसमें बहुत पैसा लगता है? और क्या मुझे वहाँ खुद जाकर बोलना पड़ेगा, अंग्रेज़ी में?"
    reference: "Just hearing the word tribunal scares me. Does it cost a lot of money? And will I have to go there and speak myself, in English?"
    student: "Just hearing the word tribunal scares me. Does it cost a lot? And will I have to go there and speak for myself, in English?"
  - speaker: "en"
    text: "The application fee is modest, around sixty dollars, and you may qualify for a reduced fee. You can request a free interpreter, and our centre can help you prepare your submission."
    reference: "आवेदन की फ़ीस ज़्यादा नहीं है, लगभग साठ डॉलर, और हो सकता है कि आप कम फ़ीस के लिए भी पात्र हों। आप मुफ़्त दुभाषिए की माँग कर सकती हैं, और हमारा सेंटर आपका लिखित पक्ष तैयार करने में मदद कर सकता है।"
    student: "आवेदन की फ़ीस ज़्यादा नहीं है, लगभग साठ डॉलर, और शायद आपको कम फ़ीस देनी पड़े। आप मुफ़्त दुभाषिया माँग सकती हैं, और हमारा सेंटर ट्रिब्यूनल में आपकी तरफ़ से केस लड़ेगा।"
  - speaker: "hi"
    text: "चलिए, ये सुनकर तसल्ली हुई। मैं आज ही शाम को agent को email कर दूँगी और आपको भी उसकी copy भेज दूँगी। बहुत-बहुत धन्यवाद।"
    reference: "Well, that's a relief to hear. I'll email the agent this evening and send you a copy as well. Thank you very much."
    student: "That's a relief to hear. I'll email the agent this evening and send you a copy too. Thank you so much."
