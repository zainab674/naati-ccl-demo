id: "community-newborn-family-payment"
title: "Family Payment for a Newborn"
scenario: "A government services officer explains fortnightly family payments to a new mother on maternity leave and how to apply."
domain: "Community"
difficulty: "Easy"
language_pair: "hi-en"
speakers:
  en: { role: "Services officer", gender: "male" }
  hi: { role: "New mother", gender: "female" }
segments:
  - speaker: "en"
    text: "Hello, thanks for waiting. I understand you'd like to find out about family payments for your new baby. Congratulations! When was your baby born?"
    reference: "नमस्ते, इंतज़ार करने के लिए धन्यवाद। मुझे पता चला है कि आप अपने नवजात बच्चे के लिए फ़ैमिली पेमेंट्स के बारे में जानना चाहती हैं। बहुत-बहुत बधाई हो! आपका बच्चा कब पैदा हुआ?"
    student: "नमस्ते, इंतज़ार के लिए धन्यवाद। मुझे पता चला है कि आप अपने नए बच्चे के लिए फ़ैमिली पेमेंट्स के बारे में जानना चाहती हैं। बधाई हो! बच्चे का जन्म कब हुआ?"
  - speaker: "hi"
    text: "Thank you! मेरी बेटी 12 अगस्त को पैदा हुई थी, यानी अभी पाँच हफ़्ते की है। हॉस्पिटल में किसी ने बताया था कि हमें कुछ पैसे मिल सकते हैं।"
    reference: "Thank you! My daughter was born on the 12th of August, so she's five weeks old now. Someone at the hospital told us we might be able to get some payments."
    student: "Thank you! My daughter was born on the 20th of August, so she's five weeks old now. Someone at the hospital said we might get some money."
  - speaker: "en"
    text: "That's right. Depending on your family income, you may be eligible for a fortnightly family payment. Can I ask what your combined household income is, roughly, for this financial year?"
    reference: "जी, सही है। आपके परिवार की आमदनी के हिसाब से, आप हर पखवाड़े, यानी हर दो हफ़्ते में मिलने वाले फ़ैमिली पेमेंट की हक़दार हो सकती हैं। क्या मैं पूछ सकता हूँ कि इस वित्तीय वर्ष में आपके घर की कुल आमदनी लगभग कितनी है?"
    student: "जी, सही है। आपकी फ़ैमिली की आमदनी के हिसाब से आपको फ़ैमिली पेमेंट मिल सकता है। क्या मैं पूछ सकता हूँ कि इस फ़ाइनेंशियल ईयर में आपके घर की कुल आमदनी लगभग कितनी है?"
  - speaker: "hi"
    text: "मेरे husband की salary साल की लगभग 78,000 डॉलर है। मैं पहले part-time काम करती थी, पर अभी maternity leave पर हूँ, तो मेरी कोई income नहीं है।"
    reference: "My husband's salary is about 78,000 dollars a year. I used to work part-time, but I'm on maternity leave at the moment, so I don't have any income."
    student: "My husband earns about $78,000 a year. I used to work part-time but I'm on maternity leave now, so I have no income."
  - speaker: "en"
    text: "Thank you. With that income, you should qualify for a payment. To apply, we'll need the baby's birth registration, your tax file numbers, and your bank account details."
    reference: "धन्यवाद। इस आमदनी के हिसाब से आपको पेमेंट मिलना चाहिए। आवेदन के लिए हमें बच्चे के जन्म के रजिस्ट्रेशन की जानकारी, आपके टैक्स फ़ाइल नंबर और आपके बैंक अकाउंट की डिटेल्स चाहिए होंगी।"
    student: "धन्यवाद। इस आमदनी पर आपको पेमेंट मिलना चाहिए। अप्लाई करने के लिए हमें बच्चे का पासपोर्ट, सॉरी, बच्चे का बर्थ रजिस्ट्रेशन, आपके टैक्स फ़ाइल नंबर और बैंक अकाउंट की डिटेल्स चाहिए।"
  - speaker: "hi"
    text: "Birth registration का form तो हमने भर दिया था, पर certificate अभी तक नहीं आया। क्या उसके बिना apply नहीं हो सकता?"
    reference: "We've filled in the birth registration form, but the certificate hasn't arrived yet. Can't we apply without it?"
    student: "We did fill in the birth registration form, but the certificate hasn't come yet. Can't we apply without it?"
  - speaker: "en"
    text: "You can still apply now. You don't need the certificate, just the registration details. If you apply within 13 weeks of the birth, payments can be backdated to her birth date."
    reference: "आप अभी भी आवेदन कर सकती हैं। आपको सर्टिफ़िकेट की ज़रूरत नहीं है, सिर्फ़ रजिस्ट्रेशन की जानकारी चाहिए। अगर आप जन्म के 13 हफ़्तों के अंदर आवेदन करती हैं, तो पेमेंट उसकी जन्म-तिथि से गिनकर मिल सकते हैं।"
    student: "आप अभी भी अप्लाई कर सकती हैं। सर्टिफ़िकेट की ज़रूरत नहीं है, बस रजिस्ट्रेशन की डिटेल्स चाहिए। अगर आप जन्म के 13 हफ़्तों के अंदर अप्लाई करती हैं, तो पेमेंट उसकी जन्म-तिथि से मिलेंगे, और एक बार का बोनस भी मिलेगा।"
  - speaker: "hi"
    text: "अच्छा, ये तो अच्छी बात है। तो क्या मैं ये सब online ही कर सकती हूँ? मेरे पास सुबह-सुबह office आने का time नहीं होता।"
    reference: "Oh, that's good. So can I do all of this online? I don't have time to come into the office early in the morning."
    student: "Oh, that's good news. So can I do all this online? I don't get time to come to the office early in the morning."
  - speaker: "en"
    text: "Yes, you can apply online through your account. If you get stuck, call our multilingual phone line and ask for a Hindi interpreter. There's no cost for that service."
    reference: "जी हाँ, आप अपने अकाउंट के ज़रिए ऑनलाइन आवेदन कर सकती हैं। अगर कहीं अटक जाएँ, तो हमारी बहुभाषी फ़ोन लाइन पर कॉल करके हिंदी दुभाषिए की माँग कीजिए। उस सेवा का कोई शुल्क नहीं है।"
    student: "हाँ हाँ, अपने अकाउंट से ऑनलाइन कर लो। कहीं फँस जाओ तो हमारी मल्टीलिंगुअल लाइन पर फ़ोन करके हिंदी इंटरप्रेटर माँग लेना। उसका कोई पैसा नहीं लगता।"
  - speaker: "hi"
    text: "बहुत-बहुत धन्यवाद, आपने सब कुछ बहुत अच्छे से समझा दिया। मैं आज शाम को ही husband के साथ बैठकर apply कर दूँगी।"
    reference: "Thank you so much, you've explained everything really well. I'll sit down with my husband this evening and apply."
    student: "Thank you very much, you explained everything really well. I'll sit with my husband this evening and apply."
