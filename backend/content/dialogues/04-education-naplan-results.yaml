id: "education-naplan-numeracy"
title: "NAPLAN Results Meeting"
scenario: "A Year 5 teacher meets a parent to explain her son's NAPLAN results and recommend extra numeracy support."
domain: "Education"
difficulty: "Moderate"
language_pair: "hi-en"
speakers:
  en: { role: "Teacher", gender: "male" }
  hi: { role: "Parent", gender: "female" }
segments:
  - speaker: "en"
    text: "Thanks for coming in, Mrs Gupta. I wanted to go through Aarav's Year 5 NAPLAN results with you, which arrived last week, and talk about how we can support him."
    reference: "आने के लिए धन्यवाद, गुप्ता जी। मैं आपके साथ आरव के Year 5 के NAPLAN रिज़ल्ट्स देखना चाहता था, जो पिछले हफ़्ते आए हैं, और इस पर बात करना चाहता था कि हम उसकी मदद कैसे कर सकते हैं।"
    student: "आने के लिए धन्यवाद, गुप्ता जी। मैं आपके साथ आरव के Year 5 NAPLAN रिज़ल्ट्स पर बात करना चाहता था, जो पिछले हफ़्ते आए हैं, और यह भी कि हम उसकी मदद कैसे कर सकते हैं।"
  - speaker: "hi"
    text: "जी, रिज़ल्ट मैंने देखा था, पर सच बताऊँ तो मुझे ठीक से समझ नहीं आया। Reading में कुछ और लिखा था और maths में कुछ और।"
    reference: "Yes, I saw the results, but to be honest I didn't really understand them. It said one thing for reading and something else for maths."
    student: "Yes, I did see the results, but honestly I didn't understand them properly. Reading said one thing and maths said something different."
  - speaker: "en"
    text: "NAPLAN has four levels: Exceeding, Strong, Developing, and Needs additional support. Aarav was 'Exceeding' in reading and writing, which is excellent, but in numeracy he's at 'Needs additional support'."
    reference: "NAPLAN में चार स्तर होते हैं: 'एक्सीडिंग', 'स्ट्रॉन्ग', 'डेवलपिंग' और 'नीड्स एडिशनल सपोर्ट', यानी अतिरिक्त मदद की ज़रूरत। आरव रीडिंग और राइटिंग में 'एक्सीडिंग' था, जो बहुत बढ़िया है, लेकिन न्यूमरेसी यानी गणित में वह 'नीड्स एडिशनल सपोर्ट' पर है।"
    student: "NAPLAN में चार लेवल होते हैं: एक्सीडिंग, स्ट्रॉन्ग और नीड्स एडिशनल सपोर्ट। आरव रीडिंग और राइटिंग में एक्सीडिंग था, जो बहुत अच्छा है, पर गणित में वह नीड्स एडिशनल सपोर्ट पर है।"
  - speaker: "hi"
    text: "Maths में? पर घर पर तो वो हर रोज़ आधा घंटा tuition का homework करता है। उसके tutor ने तो कभी कोई शिकायत नहीं की।"
    reference: "In maths? But at home he does half an hour of tutoring homework every day. His tutor has never complained about anything."
    student: "In maths? But at home he does an hour and a half of tuition homework every day. His tutor never made any complaint."
  - speaker: "en"
    text: "That's good to hear. From what I see in class, his basic calculation is fine. The difficulty is with worded problems, where he has to read a question and decide which operation to use."
    reference: "यह सुनकर अच्छा लगा। क्लास में मैं जो देखता हूँ, उसके हिसाब से उसका बेसिक हिसाब-किताब ठीक है। दिक़्क़त शब्दों वाले सवालों में है, जहाँ उसे सवाल पढ़कर तय करना होता है कि कौन-सा गणितीय ऑपरेशन इस्तेमाल करना है।"
    student: "यह सुनकर अच्छा लगा। क्लास में मैंने देखा है कि उसकी बेसिक कैलकुलेशन ठीक है। मुश्किल वर्ड प्रॉब्लम्स में आती है, जहाँ उसे सवाल पढ़कर तय करना होता है कि कौन-सा ऑपरेशन इस्तेमाल करना है।"
  - speaker: "hi"
    text: "हाँ, ये बात सही है। उसका tutor ज़्यादातर सिर्फ़ sums करवाता है, पढ़ने वाले सवाल कम ही देता है। तो हमें अब क्या करना चाहिए?"
    reference: "Yes, that's true. His tutor mostly just gives him sums to do, and rarely gives him questions that involve reading. So what should we do now?"
    student: "Yes, that's right. His tutor mostly, um, just does sums with him, not many... reading-type questions. So what should we, uh, do now?"
  - speaker: "en"
    text: "We run a small-group numeracy program on Tuesday and Thursday mornings, from 8:15 to 8:45, before class. It's free, and I'd like to recommend Aarav join from next term."
    reference: "हम मंगलवार और गुरुवार को सुबह, क्लास से पहले, 8:15 से 8:45 तक छोटे ग्रुप में गणित का एक प्रोग्राम चलाते हैं। यह मुफ़्त है, और मेरी सलाह है कि आरव अगले टर्म से इसमें शामिल हो।"
    student: "हम सोमवार और गुरुवार सुबह, क्लास से पहले, 8:15 से 8:45 तक छोटे ग्रुप में गणित का प्रोग्राम चलाते हैं। यह मुफ़्त है, और मैं चाहूँगा कि आरव अगले टर्म से इसमें आए।"
  - speaker: "hi"
    text: "सुबह 8:15 तो थोड़ा मुश्किल है, क्योंकि मेरी shift 7 बजे शुरू होती है और उसके पापा छोटी बहन को daycare छोड़ते हैं। पर हम कुछ इंतज़ाम कर लेंगे।"
    reference: "Quarter past eight in the morning is a bit difficult, because my shift starts at 7 and his dad drops his little sister at daycare. But we'll arrange something."
    student: "8:15 in the morning is a bit hard, because my shift starts at 7 o'clock and his father drops his younger sister at daycare. But we'll make some arrangement."
  - speaker: "en"
    text: "I understand. The school also offers before-school care from 7 a.m., which may be subsidised. I'll email you the enrolment form and some practice worksheets you can do together at home."
    reference: "मैं समझता हूँ। स्कूल में सुबह 7 बजे से बिफ़ोर-स्कूल केयर की सुविधा भी है, जिस पर सब्सिडी मिल सकती है। मैं आपको एनरोलमेंट फ़ॉर्म और कुछ प्रैक्टिस वर्कशीट्स ईमेल कर दूँगा, जो आप घर पर उसके साथ बैठकर कर सकती हैं।"
    student: "मैं समझता हूँ। स्कूल में सुबह 7 बजे से बिफ़ोर-स्कूल केयर भी है। मैं आपको एनरोलमेंट फ़ॉर्म और कुछ प्रैक्टिस वर्कशीट्स ईमेल कर दूँगा, जो आप घर पर साथ में कर सकती हैं।"
  - speaker: "hi"
    text: "बहुत अच्छा, फिर तो problem ही solve हो गई। आप उस पर इतना ध्यान देते हैं, उसके लिए thank you। मैं आज रात ही उससे बात करूँगी।"
    reference: "That's great, then the problem is solved. Thank you for paying so much attention to him. I'll talk to him tonight."
    student: "That's great, so the problem is solved then. Thank you for giving him so much attention. I'll talk to him tonight."
