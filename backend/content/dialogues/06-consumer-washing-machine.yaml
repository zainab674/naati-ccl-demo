id: "consumer-faulty-washing-machine"
title: "Faulty Washing Machine Refund"
scenario: "A customer returns to an appliance retailer about a seven-month-old washing machine that has stopped spinning and is leaking."
domain: "Consumer Affairs"
difficulty: "Moderate"
language_pair: "hi-en"
speakers:
  en: { role: "Customer service manager", gender: "male" }
  hi: { role: "Customer", gender: "female" }
segments:
  - speaker: "en"
    text: "Good morning, I'm the customer service manager. I'm told you're having a problem with a washing machine you bought from us. Do you have the receipt or order number?"
    reference: "नमस्ते, मैं कस्टमर सर्विस मैनेजर हूँ। मुझे बताया गया है कि आपने हमसे जो वॉशिंग मशीन ख़रीदी थी, उसमें कुछ परेशानी आ रही है। क्या आपके पास रसीद या ऑर्डर नंबर है?"
    student: "नमस्ते, मैं कस्टमर सर्विस मैनेजर हूँ। मुझे बताया गया है कि हमारे यहाँ से ख़रीदी गई वॉशिंग मशीन में आपको कोई प्रॉब्लम आ रही है। क्या आपके पास रसीद या ऑर्डर नंबर है?"
  - speaker: "hi"
    text: "हाँ, ये रही receipt। हमने ये मशीन सात महीने पहले 1,149 डॉलर में ली थी। पिछले दो हफ़्ते से ये spin ही नहीं कर रही और नीचे से पानी भी लीक होता है।"
    reference: "Yes, here's the receipt. We bought this machine seven months ago for 1,149 dollars. For the past two weeks it hasn't been spinning at all, and water leaks from the bottom as well."
    student: "Yes, here's the receipt. We bought this machine seven months ago for $1,194. For the last two weeks it isn't spinning at all and water also leaks from the bottom."
  - speaker: "en"
    text: "I'm sorry to hear that. Since it's still within the twelve-month manufacturer's warranty, the usual process is for you to contact the manufacturer directly to book a technician."
    reference: "यह सुनकर मुझे अफ़सोस हुआ। क्योंकि यह अभी भी निर्माता की बारह महीने की वारंटी में है, इसलिए आम तौर पर तरीक़ा यह है कि आप सीधे निर्माता कंपनी से संपर्क करके टेक्नीशियन बुक करें।"
    student: "यह सुनकर अफ़सोस हुआ। क्योंकि यह अभी मैन्युफ़ैक्चरर की बारह महीने की वारंटी में है, तो आम तौर पर आपको सीधे मैन्युफ़ैक्चरर से संपर्क करके टेक्नीशियन बुक करना होता है।"
  - speaker: "hi"
    text: "पर मैंने तो machine आपसे ख़रीदी है, company से नहीं। और मैं तीन बार उनके customer care पर फ़ोन कर चुकी हूँ, हर बार आधा घंटा hold पर रखते हैं।"
    reference: "But I bought the machine from you, not from the company. And I've already called their customer care three times, and every time they keep me on hold for half an hour."
    student: "But I bought the machine from you, not from the company. And I've called their customer care, and every time they keep me on hold for half an hour."
  - speaker: "en"
    text: "You're right, and I apologise. Under the Australian Consumer Law, you're entitled to deal with us as the retailer. We can arrange the repair on your behalf."
    reference: "आप सही कह रही हैं, और मैं माफ़ी चाहता हूँ। ऑस्ट्रेलियन कंज़्यूमर लॉ के तहत आपको हमसे, यानी विक्रेता से, सीधे बात करने का हक़ है। हम आपकी तरफ़ से मरम्मत का इंतज़ाम कर सकते हैं।"
    student: "आप सही हैं, मैं माफ़ी चाहता हूँ। मतलब... ऑस्ट्रेलियन कंज़्यूमर लॉ के तहत आप, उह, हमसे यानी रिटेलर से बात कर सकती हैं। हम आपकी तरफ़ से रिपेयर करवा सकते हैं।"
  - speaker: "hi"
    text: "मुझे repair नहीं चाहिए। नई machine में इतनी जल्दी ये problem आना ठीक नहीं है। मुझे या तो पूरा refund चाहिए या फिर नई machine।"
    reference: "I don't want a repair. It's not right for a new machine to have this problem so soon. I want either a full refund or a new machine."
    student: "I don't want a repair. It's not okay for a new machine to have this problem so quickly. I want either a full refund or a new machine."
  - speaker: "en"
    text: "If the fault is a major failure, for example if the machine is unsafe or can't be fixed within a reasonable time, you can choose a refund or a replacement."
    reference: "अगर यह ख़राबी 'मेजर फ़ेलियर' यानी बड़ी ख़राबी है, जैसे कि मशीन इस्तेमाल के लिए सुरक्षित नहीं है या उचित समय के अंदर ठीक नहीं हो सकती, तो आप रिफ़ंड या नई मशीन में से चुन सकती हैं।"
    student: "अगर यह बड़ी ख़राबी है, जैसे मशीन सुरक्षित नहीं है या ठीक समय में रिपेयर नहीं हो सकती, तो हम तय करेंगे कि आपको रिफ़ंड मिलेगा या नई मशीन।"
  - speaker: "hi"
    text: "पानी लीक होने से मेरी laundry का floor भी ख़राब हो गया है, और पिछले हफ़्ते मेरा बेटा वहाँ फिसलते-फिसलते बचा। ये unsafe नहीं है तो क्या है?"
    reference: "Because of the leak, my laundry floor has been damaged too, and last week my son nearly slipped there. If that's not unsafe, what is?"
    student: "The leaking water has damaged my laundry floor as well, and last week my son almost slipped there. If this isn't unsafe, then what is?"
  - speaker: "en"
    text: "That's a fair point. I'll send a technician to inspect it this Thursday. If they confirm the leak, we'll offer you a replacement or a full refund of $1,149."
    reference: "आपकी बात जायज़ है। मैं इस गुरुवार को एक टेक्नीशियन भेजूँगा जो इसकी जाँच करेगा। अगर वह लीक की पुष्टि कर देता है, तो हम आपको नई मशीन या 1,149 डॉलर का पूरा रिफ़ंड देंगे।"
    student: "आपकी बात सही है। मैं इस गुरुवार को जाँच के लिए एक टेक्नीशियन भेजूँगा। अगर वह लीक कन्फ़र्म कर देता है, तो हम आपको नई मशीन या 1,149 डॉलर का पूरा रिफ़ंड देंगे।"
  - speaker: "hi"
    text: "ठीक है, गुरुवार चलेगा, पर सुबह ग्यारह बजे से पहले भेजिएगा, क्योंकि दोपहर को मुझे बच्चों को school से लेना होता है। और floor के damage का क्या?"
    reference: "Okay, Thursday is fine, but please send them before eleven in the morning, because in the afternoon I have to pick the kids up from school. And what about the damage to the floor?"
    student: "Yeah, Thursday works, just make sure they rock up before eleven 'cause I gotta grab the kids from school. And what about the floor damage?"
