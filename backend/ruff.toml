line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I", "UP"]
"tests/*" = ["E402"]
"app/emails/*" = ["E501"]

[lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]
